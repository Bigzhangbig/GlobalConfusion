name: Build GPCheck image

on:
  push:
    branches: [sec-ae]
    paths: ['.github/workflows/docker-build.yml', 'Dockerfile', 'docker/**', 'src/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ghidrathon
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bigzhangbig/globalconfusion-gpcheck:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
